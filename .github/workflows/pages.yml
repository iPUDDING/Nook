name: pages

# Publica la demo web en GitHub Pages para que cualquiera pueda probar Nook
# desde el navegador, sin descargar nada.
#
# Requisito (una sola vez): Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
#
# Si el repositorio se llama <usuario>.github.io, el sitio vive en la raíz del
# dominio y NO hace falta BASE_PATH: definí la variable de repositorio
# BASE_PATH con el valor "." (Settings → Variables → Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generar out/ (con basePath del repo)
        run: npm run build:static
        env:
          # En repos de proyecto el sitio cuelga de /<repo>/. Si definiste la
          # variable BASE_PATH en el repo, manda esa.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

      - name: Evitar el procesado de Jekyll
        run: touch out/.nojekyll

      # `enablement: true` crea el sitio de Pages por API si todavía no existe.
      # Sin esto, un repo recién subido falla con "Get Pages site failed / Not
      # Found" y parece un error de compilación cuando en realidad es un ajuste
      # que nunca se hizo (Settings → Pages → Source: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
