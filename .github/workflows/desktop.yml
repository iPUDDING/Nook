name: desktop

# Compila la app de escritorio (Electron) y deja el .exe como artifact.
#
# Se dispara solo cuando cambia algo del empaquetado o de la UI, y también a mano
# desde la pestaña Actions ("Run workflow").
#
# Resultado: Actions → run "desktop" → sección "Artifacts" al final de la página
#            → nook-windows → Nook-<version>-portable.exe + Nook-<version>-setup.exe

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/export-static.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Dependencias de la web
        run: npm ci

      - name: Export estático (genera out/)
        run: npm run build:static

      - name: Dependencias del escritorio
        working-directory: desktop
        run: npm ci

      - name: Compilar .exe (portable + instalador)
        working-directory: desktop
        run: npm run build:win
        env:
          # Sin certificado de firma: el .exe sale sin firmar (SmartScreen avisa
          # la primera vez). Si algún día hay certificado, se configuran
          # CSC_LINK / CSC_KEY_PASSWORD como secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verificar que los binarios existen
        working-directory: desktop
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | Format-Table Name, Length
          if (-not (Get-ChildItem release -Filter *.exe)) {
            Write-Error 'No se generó ningún .exe'
            exit 1
          }

      - name: Subir artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nook-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
