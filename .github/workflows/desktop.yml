name: desktop

# Este workflow SÍ produce el .exe (y el .msi). Es manual a propósito: compilar
# Rust tarda ~10-15 min la primera vez, así que no conviene atarlo a cada push.
#
#   GitHub → Actions → "desktop" → Run workflow
#
# Al terminar, el instalador queda en Artifacts → nook-windows.
#
# ⚠️ No se pudo verificar en el entorno donde se escribió (no hay Rust ni
# Windows ahí). Si algo falla, el log dice en qué paso; los candidatos habituales
# son el ícono (.ico) y la versión del CLI de Tauri.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependencias del frontend
        run: npm ci

      # El CLI se instala sólo en el runner: así `package.json` no cambia y el
      # job `web` sigue usando `npm ci` contra el lockfile intacto.
      - name: Instalar el CLI de Tauri
        run: npm i -D @tauri-apps/cli@^2

      - name: Compilar instaladores
        run: npx tauri build

      - name: Publicar instaladores
        uses: actions/upload-artifact@v6
        with:
          name: nook-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
