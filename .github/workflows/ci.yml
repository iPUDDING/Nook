name: build

# Compila en cada push y en cada pull request: si el build de Next falla,
# GitHub te lo dice antes de que lo descubras en producción.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # El lockfile fija la URL de cada tarball. Si una versión no existe en el
      # registro, `npm ci` pasa en una máquina con caché y falla en CI con 404.
      - name: El lockfile apunta a versiones que existen
        run: node scripts/verificar-lockfile.mjs

      - name: Instalar dependencias (bloqueadas por package-lock)
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build

      # Genera out/ y lo empaqueta. Se sube un .zip y no la carpeta .next porque
      # upload-artifact IGNORA los archivos/dirs que empiezan con punto desde la
      # v4.4: subir ".next" produce "No files were found with the provided path".
      - name: Sitio estático descargable
        run: |
          npm run build:static
          cd out
          zip -qr ../nook-web.zip .
          cd ..
          ls -lh nook-web.zip

      - name: Publicar el artifact
        uses: actions/upload-artifact@v6
        with:
          name: nook-web
          path: nook-web.zip
          if-no-files-found: error
          retention-days: 14

  # Las suites de verificación existían pero no corrían en ningún lado: un cambio
  # podía romper el editor, la suscripción o el saneo de HTML sin que nadie se
  # enterara hasta abrir el .exe. Este job monta el sitio estático y las corre.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: El lockfile apunta a versiones que existen
        run: node scripts/verificar-lockfile.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Generar el sitio estático
        run: npm run build:static

      - name: Servir out/ en 4321
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory out &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321 >/dev/null && break
            sleep 1
          done

      # Se corren todas las suites aunque una falle: con `set -e` la primera que
      # rompe corta el job y las siguientes nunca se ejecutan, así que cada push
      # descubre un problema nuevo en vez de todos.
      - name: Verificaciones (funcionalidad, suscripción y seguridad)
        run: |
          fallos=0
          total=0
          for f in scripts/verificar-*.mjs; do
            case "$f" in *desktop*) continue ;; esac
            total=$((total+1))
            echo ""
            echo "──────── $f"
            node "$f" http://127.0.0.1:4321 || fallos=$((fallos+1))
          done
          echo ""
          echo "Suites corridas: $total · con problemas: $fallos"
          test "$fallos" -eq 0

      - name: Capturas y logs si algo falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fallo-e2e
          path: |
            test-results/
            *.log
          if-no-files-found: ignore
          retention-days: 7
