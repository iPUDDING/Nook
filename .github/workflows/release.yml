name: release

# Publica una versión para la comunidad.
#
#   git tag v0.10.0 && git push origin v0.10.0
#
# Al pushear el tag, este workflow compila el .exe de Windows y el zip de la web,
# y los adjunta a la página de Releases del repositorio. Ahí los descarga
# cualquiera sin pasar por la pestaña Actions ni tener cuenta con permisos.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: .exe (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm run build:static

      - name: Dependencias del escritorio
        working-directory: desktop
        run: npm ci

      - name: Compilar instalador + portable
        working-directory: desktop
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v6
        with:
          name: nook-windows
          path: desktop/release/*.exe
          if-no-files-found: error

  web:
    name: Web estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:static
      - name: Comprimir out/
        run: cd out && zip -qr nook-web.zip .
      - uses: actions/upload-artifact@v6
        with:
          name: nook-web
          path: out/nook-web.zip
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: nook-*
          path: dist
          merge-multiple: true

      - name: Listar archivos a publicar
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/nook-web.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Nook ${{ github.ref_name }}

            **App de escritorio (Windows 10/11, 64 bits):**
            - `Nook-*-portable.exe` — un solo archivo, no instala nada.
            - `Nook-*-setup.exe` — instalador con acceso directo y desinstalador.

            **Web:** `nook-web.zip` es el sitio estático compilado, para servir en
            cualquier hosting (Netlify, Vercel, nginx, GitHub Pages).

            > El `.exe` no está firmado con un certificado de código, así que
            > Windows SmartScreen avisa la primera vez: *Más información →
            > Ejecutar de todas formas*. Podés comprobarlo compilándolo vos mismo
            > con `cd desktop && npm run build:win`.
