name: Reportar un bug
description: Algo no funciona como debería
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: buscá en los issues existentes y probá con la última versión.
        Si es un problema de seguridad, **no lo reportes acá** (ver SECURITY.md).
  - type: dropdown
    id: plataforma
    attributes:
      label: ¿Dónde ocurre?
      options:
        - .exe portable (Windows)
        - Instalador de Windows
        - App web (npm run dev)
        - Demo en GitHub Pages
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Nook
      placeholder: '0.2.2 (aparece en el nombre del .exe o en el README)'
    validations:
      required: true
  - type: input
    id: so
    attributes:
      label: Sistema operativo y navegador
      placeholder: 'Windows 11 23H2 / Chrome 141'
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir Nook
        2. Escribir "/" en un bloque
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Qué pasó en realidad
      description: Si hay un mensaje de error, pegalo completo.
    validations:
      required: true
  - type: textarea
    id: captura
    attributes:
      label: Captura o video (opcional)
      description: Arrastrá el archivo acá.
